name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package Windows installer
        run: npm run package -- --publish never

      - name: Build on-demand parser
        run: npm run build:parser

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/parser.cjs

  build-mac:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package macOS DMG
        run: npm run package -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml

  release:
    name: Create GitHub Release
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## VirtuGene 1.1.0 — 用户体验大版本

            *Unlock Your Digital Soul.*

            ### 新增
            - 角色库扩充至 12 位数字灵魂，覆盖温柔 / 傲娇 / 治愈 / 神秘 / 热血等类型
            - 角色创建升级：AI 一次生成完整基因序列（标签/签名/开场白/性格），支持多候选对比
            - 关系系统：好感度五档「初识→熟悉→亲近→挚友→知己」，越聊越熟，进阶里程碑动画
            - 情绪系统：愉悦度心情曲线 + 自动情绪分析，角色带出情绪回应
            - 新手引导：欢迎弹窗 + 气泡提示，一键开聊
            - 消息引用/删除、「对方正在输入」状态、消息到达动效
            - 侧边栏与情绪面板拖拽调宽
            - 角色档案卡：背景、性格标签与示例对话

            ### 安装包
            - Windows：`VirtuGene-Setup-1.1.0-win.exe`
            - macOS：`VirtuGene-1.1.0-mac-*.dmg`
