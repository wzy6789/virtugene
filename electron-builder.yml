appId: com.virtugene.app
productName: VirtuGene
copyright: Copyright © 2026 VirtuGene

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - dist/renderer/**/*

publish:
  provider: github
  owner: wzy6789
  repo: virtugene

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-win.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac.${ext}
  category: public.app-category.productivity
