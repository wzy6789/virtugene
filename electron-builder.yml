appId: com.virtugene.app
productName: VirtuGene
copyright: Copyright © 2026 VirtuGene

directories:
  output: release
  buildResources: resources

electronLanguages:
  - zh-CN
  - en-US

files:
  - dist-electron/**/*
  - dist/renderer/**/*

# 原生 addon 必须解包到 asar 外，否则 require 无法加载 .node
asarUnpack:
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-win-x64/**/*

# sherpa-onnx 是 N-API prebuilt（无 binding.gyp），跳过 rebuild 防止覆盖已实测兼容的二进制
npmRebuild: false

publish:
  provider: github
  owner: wzy6789
  repo: virtugene

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-win.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
